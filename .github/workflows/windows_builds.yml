name: 🏁 Windows Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  # werror=no: o MSVC 4.7.2 trata C4723 ("potential divide by 0" em
  # core/math/math_funcs.h, falso-positivo do ternário) como erro.
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
    werror=no
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build-windows:
    # Windows 10 with latest image
    runs-on: windows-latest
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: windows-editor
            target: editor
            scons-flags: >-
              windows_subsystem=console
              vsproj=yes
              vsproj_gen_only=no
            bin: ./bin/godot.windows.editor.x86_64.exe
            compiler: msvc

          - name: Editor w/ clang-cl (target=editor, use_llvm=yes)
            cache-name: windows-editor-clang
            target: editor
            scons-flags: >-
              windows_subsystem=console
              use_llvm=yes
            bin: ./bin/godot.windows.editor.x86_64.llvm.exe
            compiler: clang

          - name: Template (target=template_release)
            cache-name: windows-template
            target: template_release
            bin: ./bin/godot.windows.template_release.x86_64.console.exe
            compiler: msvc

          - name: Template w/ GCC (target=template_release, use_mingw=yes)
            cache-name: windows-template-gcc
            # MinGW takes MUCH longer to compile; save time by only targeting Template.
            target: template_release
            scons-flags: use_mingw=yes
            bin: ./bin/godot.windows.template_release.x86_64.console.exe
            compiler: gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }} angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          Write-Host "::notice title=step::prepare artifact"
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force
          Write-Host "::notice title=step::prepare artifact ok"

      - name: Marker before upload
        if: matrix.compiler == 'msvc'
        run: Write-Host "::notice title=step::upload artifact"

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        shell: bash
        run: |
          set +e
          STATUS=0
          SV=0
          SH=0
          ST=0
          {
            echo "== --version =="
            ${{ matrix.bin }} --version || { SV=1; STATUS=1; }
            echo "== --help =="
            ${{ matrix.bin }} --help || { SH=1; STATUS=1; }
            echo "== --test =="
            ${{ matrix.bin }} --test --force-colors || { ST=1; STATUS=1; }
          } > unit_tests.log 2>&1
          set -e
          cat unit_tests.log || true
          echo "::notice title=unit substatuses::version=$SV help=$SH test=$ST"
          if [ "$STATUS" -ne 0 ]; then
            grep -E "ERROR:|FATAL:|FAILED|failed|doctest|SUMMARY|Assertion|Leak|leaked|CRASH|Segmentation|passed" unit_tests.log > unit_hits.txt || true
            tail -c 4000 unit_tests.log >> unit_hits.txt || true
            n=0
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n + 1))
              if [ "$n" -gt 40 ]; then break; fi
              echo "::error unit: $line"
            done < unit_hits.txt
            exit "$STATUS"
          fi

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -f scons_ci.log ]; then
            echo "::error title=Windows failure::scons RODOU (ver tail na anotação 'SCons ... failed' ou no step de build). Últimas linhas:"
            tail -n 30 scons_ci.log | sed -e 's/%/%25/g' -e 's/\r//g' -e 's/$/%0A/' | tr -d '\n' | sed 's/^/::error /'
          else
            echo "::error title=Windows failure::scons NUNCA RODOU — falha em passo anterior ao build (checkout/cache/Python/SDK downloads)."
            ls -la || true
          fi
